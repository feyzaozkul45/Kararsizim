<header class="navbar">
  <div class="container navbar-inner">
    <a class="logo" href="{% url 'poll_list' %}"><span class="logo-text">kararsızım</span> 🤔</a>
    <nav class="nav-links" aria-label="Ana menü">
      {% if user.is_authenticated %}
        <a class="btn btn-small" href="{% url 'poll_create' %}">+ Anket aç</a>
        <a class="nav-link" href="{% url 'my_polls' %}">Anketlerim</a>
        <span class="nav-user">@{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="inline-form">
          {% csrf_token %}
          <button type="submit" class="nav-link nav-link-button">Çıkış</button>
        </form>
      {% else %}
        <a class="nav-link" href="{% url 'login' %}">Giriş</a>
        <a class="btn btn-small" href="{% url 'register' %}">Kayıt ol</a>
      {% endif %}
    </nav>
  </div>
</header>
